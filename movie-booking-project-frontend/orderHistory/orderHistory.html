<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link rel="stylesheet" href="orderHistory.css">
</head>
<body>
    <div class="container">
        <h1>Your Order History</h1>
        <!-- Order History Section (only for logged-in users) -->
        <section id="orderHistorySection" style="display:table;">
            <table id="orderHistoryTable">
                <thead>
                    <tr>
                        <th>Booking ID</th>
                        <th>Movie</th>
                        <th>Showtime</th>
                        <th>Tickets</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Orders will be injected here via JS -->
                </tbody>
            </table>
        </section>
    </div>
    <script src="orderHistory.js"></script>

</body>
