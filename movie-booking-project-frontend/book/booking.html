<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Page</title>
    <link rel="stylesheet" href="booking.css">
</head>
<body>
    <h1>Booking Page</h1>

    <div class="booking-info">
        <p><strong>Movie:</strong> <span id="movieTitle"></span></p>
        <p><strong>Showtime:</strong> <span id="showtime"></span></p>

        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="tickets">Number of Tickets</label>
        <input type="number" id="tickets" min="1" max="10" value="1">

        <button id="confirmBtn">Confirm Booking</button>
    </div>
    
    <div id="seatPreviewContainer">
    <h2>Seat Map (Preview)</h2>
    <div id="seatPreview"></div>
    <p class="legend">
      <span class="legend-box available"></span> Available
      <span class="legend-box taken"></span> Taken
    </p>
    </div>

   <script src="booking.js"></script>

</body>
</html>
