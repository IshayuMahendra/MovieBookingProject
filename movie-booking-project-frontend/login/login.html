<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In to CES</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h1>Sign In to CES</h1>

        <div id="errorBox" class="error hidden"></div>

        <form id="loginForm">
            <label for="email">Email</label>
           <input type="email" id="email" required placeholder="Enter your email" autocomplete="email">

            <label for="password">Password</label>
           <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">

            <div class="checkbox-container">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <button type="button" id="forgotPasswordBtn">Forgot Password?</button>
            <button type="submit" id="loginBtn">Sign In</button>
        </form>

        <p>or</p>
        <button id="signupRedirect">Create Account</button>
        <button id="adminLoginBtn">Admin Login</button>

    </div>

    <script src="login.js"></script>
</body>
</html>
