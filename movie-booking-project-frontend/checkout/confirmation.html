<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="confirmation.css">
</head>
<body>

    <div id="container">
        <h1>🎉 Order Confirmed!</h1>

        <p>Thank you for your purchase. Here is your order summary:</p>

        <div id="summaryBox">
            <p><strong>Booking ID:</strong> <span id="bookingId"></span></p>
            <p><strong>Subtotal:</strong> $<span id="subtotal"></span></p>
            <p><strong>Discount:</strong> $<span id="discount"></span></p>
            <p><strong>Total Paid:</strong> $<span id="total"></span></p>
        </div>

        <button id="homeBtn">Return to Home</button>
    </div>

    <script src="confirmation.js"></script>
</body>
</html>
